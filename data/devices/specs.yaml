# Published specifications: what chip and phone makers state, with a URL and a date.
#
# Rules (docs/METRICS.md, "Provenance classes"):
# - Only maker sources here. A secondary source (Wikipedia, GSMArena, Notebookcheck,
#   NanoReview) may appear only with `secondary: true`, and none does at present.
# - Units exactly as printed. Qualcomm prints DRAM limits in MHz without saying MT/s; we do
#   not convert them.
# - `checked_by` lists who opened the source and confirmed the value: `claude` (this repo's
#   maintainer agent), `codex` (independent review, gpt-6.1-sol). P2 requires two checkers on
#   every value before publication.
# - Anything a phone reports about itself (cores, clocks, GPU renderer, MemTotal) is NOT
#   here: it comes from the probe. A value here never overrides a probe reading; a mismatch
#   is listed in docs/DEVICES.md.
# - Absent key = unknown. No vendor reviewed publishes a BF16 or FP16 TFLOPS figure for any
#   of these chips, nor a DRAM bus width, so neither appears.

retrieved: 2026-10-04

