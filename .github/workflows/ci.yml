name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Lint, unit tests, and every generated file checked against its schema. No network,
    # no device: Device Farm and Hub access happen only from a maintainer's machine.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - run: python -m pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m execubench validate
